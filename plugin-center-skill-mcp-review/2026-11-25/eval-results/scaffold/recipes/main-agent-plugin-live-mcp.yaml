apiVersion: "luckee-ads-eval/v1"
kind: "EvalRecipe"
metadata:
  name: "main-agent-plugin-live-mcp"
  description: "9 个 luckee-official 主 Agent MCP 的逐项真实调用可行性；来自 2026-11-26 Playwright live thread。"
spec:
  eval_set: "plugin-center-live-0.3.1"
  harness: "main_agent_session"
  cases:
    ids:
      - "main-agent-plugin-live-mcp-01"
      - "main-agent-plugin-live-mcp-02"
      - "main-agent-plugin-live-mcp-03"
      - "main-agent-plugin-live-mcp-04"
      - "main-agent-plugin-live-mcp-05"
      - "main-agent-plugin-live-mcp-06"
      - "main-agent-plugin-live-mcp-07"
      - "main-agent-plugin-live-mcp-08"
      - "main-agent-plugin-live-mcp-09"
  prompt:
    inline: "回答 case {{case_id}} 的 input/task.md 用户原话；保留完整回复和工具轨迹。只验证 Skill / MCP 路径、加载与调用可行，不评价业务效果。"
  provider:
    fixture: false
    language: "CN"
    timeout_seconds: 300
    semantic_judge: false
  assert:
    gate: "main_agent"
    assertions:
      - type: "python"
        value: "file://asserts/main_agent_gate.py"
        metric: "main_agent_seed"
      - type: "python"
        value: "file://asserts/main_agent_gate.py"
        metric: "main_agent_semantic"
  sharing:
    apiBaseUrl: "http://34.143.132.97:15555"
    appBaseUrl: "http://34.143.132.97:15555"
