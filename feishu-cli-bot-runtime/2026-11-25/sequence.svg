<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L9,4 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="30" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#666">图 1　CLI Bot 身份替换 IM Feishu 连接：控制面、消息面与工具面时序</text><rect x="20" y="50" width="240" height="86" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="140" y="87" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222">飞书用户 / 群</text><text x="140" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#555">消息、私聊、卡片动作</text><line x1="140" y1="140" x2="140" y2="1195" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 7"/><rect x="310" y="50" width="240" height="86" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="430" y="87" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222">飞书开放平台 / 能力资源</text><text x="430" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#555">IM · Wiki · Docx · Drive · Contact · Task · Approval</text><line x1="430" y1="140" x2="430" y2="1195" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 7"/><rect x="600" y="50" width="240" height="86" fill="#f2f2f0" stroke="#222" stroke-width="1.5"/><text x="720" y="87" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222">CLI Bot Runtime</text><text x="720" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#555">event consume · IM/API · Go extension</text><line x1="720" y1="140" x2="720" y2="1195" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 7"/><rect x="890" y="50" width="240" height="86" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="1010" y="87" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222">Luckee Cloud / 状态</text><text x="1010" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#555">credentialRef · binding · outbox · lease</text><line x1="1010" y1="140" x2="1010" y2="1195" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 7"/><rect x="1180" y="50" width="240" height="86" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="1300" y="87" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222">主 Agent</text><text x="1300" y="116" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#555">会话 · 工具调用 · 答案生成</text><line x1="1300" y1="140" x2="1300" y2="1195" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 7"/><line x1="1010" y1="190" x2="720" y2="190" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="865.0" y="156" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="865.0" dy="0">控制面：credentialRef → App ID/Secret / tenant token</tspan><tspan x="865.0" dy="22">scope + event readiness + 已发布版本</tspan></text><line x1="140" y1="260" x2="430" y2="260" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285.0" y="248" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="285.0" dy="0">@Bot / 私聊 / 卡片按钮</tspan></text><line x1="430" y1="330" x2="720" y2="330" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575.0" y="296" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="575.0" dy="0">event consume im.message.receive_v1 / card.action.trigger</tspan><tspan x="575.0" dy="22">Bot 长连接，NDJSON 事件流</tspan></text><line x1="720" y1="400" x2="1010" y2="400" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="865.0" y="388" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="865.0" dy="0">规范化事件：message_id / event_id / chat / thread / mentions / action</tspan></text><line x1="1010" y1="540" x2="1300" y2="540" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1155.0" y="528" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="1155.0" dy="0">durable WSS delivery → 主 Agent 会话</tspan></text><line x1="1300" y1="610" x2="1010" y2="610" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1155.0" y="598" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="1155.0" dy="0">工具请求：search / read / send / approval / task</tspan></text><line x1="1010" y1="680" x2="720" y2="680" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="865.0" y="668" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="865.0" dy="0">工具网关：connection、白名单、资源 ACL、强制 --as bot</tspan></text><line x1="720" y1="750" x2="430" y2="750" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575.0" y="738" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="575.0" dy="0">tenant token 调 Wiki / Docx / Drive / Contact / Task / Approval</tspan></text><line x1="430" y1="820" x2="720" y2="820" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575.0" y="808" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="575.0" dy="0">结构化结果、引用链接、权限 / 限频错误</tspan></text><line x1="720" y1="890" x2="1300" y2="890" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1010.0" y="878" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="1010.0" dy="0">归一化工具结果与证据片段</tspan></text><line x1="1300" y1="960" x2="1010" y2="960" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1155.0" y="948" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="1155.0" dy="0">答案 / 卡片 / 附件 / 审批动作</tspan></text><line x1="1010" y1="1030" x2="720" y2="1030" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="865.0" y="1018" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="865.0" dy="0">renderer action + outbox + same-card phase</tspan></text><line x1="720" y1="1100" x2="430" y2="1100" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575.0" y="1088" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="575.0" dy="0">IM 发送 / 卡片更新 / 文件 / 任务</tspan></text><line x1="430" y1="1170" x2="140" y2="1170" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285.0" y="1158" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px"><tspan x="285.0" dy="0">working / final / error，答案与引用</tspan></text><path d="M1010,470 L1090,470 L1090,505 L1010,505" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1102" y="452" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px">connection / 群绑定 / 去重 / lease</text><text x="1102" y="477" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:7px">threadLink / approvalIntent / outbox</text><rect x="20" y="1215" width="1400" height="118" fill="#f7f7f5" stroke="#ccc" stroke-width="1"/><text x="40" y="1246" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#333">替换边界：只替换飞书消息通道与工具执行层；保留 Cloud/Desktop 的连接、群绑定、线程映射、审批与 outbox。</text><text x="40" y="1276" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#333">状态语义：durable delivery、same-card working/final/error、AskUserQuestion、审批幂等仍由现有链路拥有。</text><text x="40" y="1306" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#333">未验证：真实应用配置、事件送达、知识库召回、生产等价性。本图是评审方案，不代表已完成切换。</text></svg>